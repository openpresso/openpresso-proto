syntax = "proto3";

package openpressod;

import "google/protobuf/empty.proto";

import public "openpresso_proto/persistent_id.proto";
import public "openpresso_proto/brew_profile.proto";
import public "openpresso_proto/brew_history.proto";
import public "openpresso_proto/machine_state.proto";
import public "openpresso_proto/user_settings.proto";
import public "openpresso_proto/metrics.proto";
import public "openpresso_proto/events.proto";

service OpenpressoDaemon {
    rpc resetScales(google.protobuf.Empty) returns (google.protobuf.Empty);

    rpc getActiveBrewProfile(google.protobuf.Empty) returns (ActiveBrewProfile);
    rpc setActiveBrewProfile(ActivateBrewProfile) returns (google.protobuf.Empty);

    rpc getPersistentBrewProfile(PersistentId) returns (PersistentBrewProfile);
    rpc addPersistentBrewProfile(BrewProfile) returns (PersistentId);
    rpc updatePersistentBrewProfile(UpdatePersistentProfile) returns (google.protobuf.Empty);
    rpc deletePersistentBrewProfile(PersistentId) returns (google.protobuf.Empty);
    rpc findPersistentBrewProfiles(FindBrewProfiles) returns (BrewProfilesSearchResult);

    rpc getUserSettings(google.protobuf.Empty) returns (UserSettings);
    rpc setUserSettings(UserSettings) returns (google.protobuf.Empty);

    rpc setPowerState(PowerState) returns (google.protobuf.Empty);
    rpc getPowerState(google.protobuf.Empty) returns (PowerState);

    rpc startBrew(google.protobuf.Empty) returns (google.protobuf.Empty);
    rpc stopBrew(google.protobuf.Empty) returns (google.protobuf.Empty);
    rpc getBrewState(google.protobuf.Empty) returns (BrewState);

    rpc setSteamModeState(SteamModeState) returns (google.protobuf.Empty);
    rpc getSteamModeState(google.protobuf.Empty) returns (SteamModeState);

    rpc events(google.protobuf.Empty) returns (stream Event);
    rpc metrics(MetricsRequest) returns (stream Metrics);

    rpc findBrewHistory(FindBrewHistory) returns (BrewHistorySearchResult);
    rpc getBrewHistoryEntry(PersistentId) returns (stream BrewHistoryStream);
    rpc removeBrewHistoryEntry(PersistentId) returns (google.protobuf.Empty);
}
